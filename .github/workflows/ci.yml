name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.85"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc

  frameworks:
    name: Framework fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.85"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: fixtures/bubbletea/go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - run: cargo build --locked --manifest-path fixtures/ratatui/Cargo.toml
      - run: go -C fixtures/bubbletea build -o "$RUNNER_TEMP/ttry-bubbletea" .
      - run: python -m pip install -r fixtures/textual/requirements.txt
      - name: Run opt-in framework smoke tests
        env:
          TTRY_RATATUI_BIN: fixtures/ratatui/target/debug/ttry-ratatui-fixture
          TTRY_BUBBLETEA_BIN: ${{ runner.temp }}/ttry-bubbletea
          TTRY_TEXTUAL_PYTHON: python
        run: cargo test --locked --test frameworks -- --ignored --test-threads=1
