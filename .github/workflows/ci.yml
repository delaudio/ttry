name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --doc

  frameworks:
    name: Framework fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: cargo build --manifest-path fixtures/ratatui/Cargo.toml
      - run: go -C fixtures/bubbletea build -o "$RUNNER_TEMP/ttry-bubbletea" .
      - run: python -m pip install textual
      - name: Run opt-in framework smoke tests
        env:
          TTRY_RATATUI_BIN: fixtures/ratatui/target/debug/ttry-ratatui-fixture
          TTRY_BUBBLETEA_BIN: ${{ runner.temp }}/ttry-bubbletea
          TTRY_TEXTUAL_PYTHON: python
        run: cargo test --test frameworks -- --ignored --test-threads=1
