[package]
name = "ttry"
default-run = "ttry"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Playwright-style end-to-end testing for terminal user interfaces"
repository = "https://github.com/delaudio/ttry"
readme = "README.md"
keywords = ["terminal", "tui", "testing", "pty"]
categories = ["development-tools::testing", "command-line-interface"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "ttry"
path = "src/main.rs"

[[bin]]
name = "ttry-fixture"
path = "src/bin/ttry-fixture.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
portable-pty = "0.9"
nix = { version = "0.28", features = ["signal", "process"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
similar = "2.7"
thiserror = "2.0"
toml = "1.1"
unicode-width = "0.2"
vte = "0.15"

[dev-dependencies]
tempfile = "3.20"
